<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Omabell Login Page</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=DM+Sans:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="card">
      <div class="wordmark">OMABELL<span>.</span></div>

      <div class="tabs" role="tablist">
        <button class="tab active" role="tab" data-target="login">
          Log in
        </button>
        <button class="tab" role="tab" data-target="signup">Sign up</button>
      </div>

      <!-- Login -->
      <form class="form active" id="login" novalidate>
        <div class="field">
          <label for="l-email">Email</label>
          <input
            id="l-email"
            type="email"
            placeholder="you@example.com"
            required
          />
        </div>
        <div class="field">
          <label for="l-pass">Password</label>
          <input id="l-pass" type="password" placeholder="••••••••" required />
        </div>
        <button type="submit" class="btn">Continue</button>
        <div class="divider">or</div>
        <button type="button" class="btn-ghost">
          <svg width="18" height="18" viewBox="0 0 48 48">
            <path
              fill="#EA4335"
              d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"
            />
            <path
              fill="#4285F4"
              d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"
            />
            <path
              fill="#FBBC05"
              d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"
            />
            <path
              fill="#34A853"
              d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.31-8.16 2.31-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"
            />
          </svg>
          Continue with Google
        </button>
        <p class="foot">Forgot password? <a href="#">Reset here.</a></p>
      </form>

      <!-- Sign up -->
      <form class="form" id="signup" novalidate>
        <div class="field">
          <label for="s-name">Full name</label>
          <input
            id="s-name"
            type="text"
            placeholder="John Doe Smith"
            required
          />
        </div>
        <div class="field">
          <label for="s-dob">Date of Birth</label>
          <input id="s-dob" type="date" required />
        </div>
        <div class="field">
          <label for="s-email">Email</label>
          <input
            id="s-email"
            type="email"
            placeholder="you@example.com"
            required
          />
        </div>
        <div class="field">
          <label for="s-pass">Password</label>
          <input
            id="s-pass"
            type="password"
            placeholder="Min. 8 characters"
            required
            minlength="8"
          />
        </div>
        <button type="submit" class="btn">Create account</button>
        <div class="divider">or</div>
        <button type="button" class="btn-ghost">
          <svg width="18" height="18" viewBox="0 0 48 48">
            <path
              fill="#EA4335"
              d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"
            />
            <path
              fill="#4285F4"
              d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"
            />
            <path
              fill="#FBBC05"
              d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"
            />
            <path
              fill="#34A853"
              d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.31-8.16 2.31-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"
            />
          </svg>
          Sign up with Google
        </button>
        <p class="foot">By signing up you agree to our <a href="#">T&C</a></p>
      </form>
    </div>

    <footer class="footer">
      <nav class="footer-links">
        <a href="#">Privacy</a>
        <a href="#">Terms</a>
        <a href="#">Security</a>
        <a href="#">Contact Us</a>
      </nav>
      <p class="footer-copy">&copy; 2026 OMABELL. All rights reserved.</p>
    </footer>
    <script src="script.js"></script>
  </body>
</html>
