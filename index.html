<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Omabell Login Page</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=DM+Sans:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- SVG Icons Library -->
    <svg style="display: none">
      <defs>
        <symbol id="icon-eye-closed" viewBox="0 0 24 24">
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" fill="none" stroke="currentColor" stroke-width="2"/>
          <circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/>
        </symbol>
        <symbol id="icon-eye-open" viewBox="0 0 24 24">
          <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24" fill="none" stroke="currentColor" stroke-width="2"/>
          <line x1="1" y1="1" x2="23" y2="23" stroke="currentColor" stroke-width="2"/>
        </symbol>
        <symbol id="icon-spinner" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2"/>
        </symbol>
        <symbol id="icon-sun" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="5"/>
          <line x1="12" y1="1" x2="12" y2="3"/>
          <line x1="12" y1="21" x2="12" y2="23"/>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
          <line x1="1" y1="12" x2="3" y2="12"/>
          <line x1="21" y1="12" x2="23" y2="12"/>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
        </symbol>
        <symbol id="icon-moon" viewBox="0 0 24 24">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </symbol>
        <symbol id="icon-google" viewBox="0 0 48 48">
          <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
          <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
          <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
          <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.31-8.16 2.31-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
        </symbol>
      </defs>
    </svg>

    <div class="card">
      <div class="card-header">
        <div class="wordmark">OMABELL<span>.</span></div>
        <button class="theme-toggle" aria-label="Toggle dark mode" title="Toggle dark mode">
          <svg class="icon-sun" viewBox="0 0 24 24"><use href="#icon-sun"/></svg>
          <svg class="icon-moon" viewBox="0 0 24 24"><use href="#icon-moon"/></svg>
        </button>
      </div>

      <div class="tabs" role="tablist">
        <button class="tab active" role="tab" data-target="login" aria-selected="true">Log in</button>
        <button class="tab" role="tab" data-target="signup" aria-selected="false">Sign up</button>
      </div>

      <!-- LOGIN FORM -->
      <form class="form active" id="login" novalidate>
        <div class="field">
          <label for="l-email">Email</label>
          <input id="l-email" type="email" placeholder="you@example.com" data-validate="email" data-validate-message="Valid email required" aria-required="true" required/>
        </div>
        <div class="field password-field">
          <label for="l-pass">Password</label>
          <input id="l-pass" type="password" placeholder="••••••••" data-validate="password" data-validate-message="Min. 8 characters" aria-required="true" data-toggle-password="true" required/>
        </div>
        <div class="field checkbox">
          <input type="checkbox" id="remember-me" data-validate="optional"/>
          <label for="remember-me">Remember me</label>
        </div>
        <button type="submit" class="btn" data-original-text="Continue">Continue</button>
        <div class="divider">or</div>
        <button type="button" class="btn-ghost" aria-label="Continue with Google">
          <svg width="18" height="18" viewBox="0 0 48 48"><use href="#icon-google"/></svg>
          Continue with Google
        </button>
        <p class="foot">Forgot password? <a href="#" onclick="openModal('reset-modal'); return false;">Reset here.</a></p>
      </form>

      <!-- SIGNUP FORM -->
      <form class="form" id="signup" novalidate>
        <div class="field">
          <label for="s-name">Full name</label>
          <input id="s-name" type="text" placeholder="John Doe Smith" data-validate="required" data-validate-message="Full name required" aria-required="true" required/>
        </div>
        <div class="field">
          <label for="s-dob">Date of Birth</label>
          <input id="s-dob" type="date" data-validate="required" data-validate-message="Date of birth required" aria-required="true" required/>
        </div>
        <div class="field">
          <label for="s-email">Email</label>
          <input id="s-email" type="email" placeholder="you@example.com" data-validate="email" data-validate-message="Valid email required" aria-required="true" required/>
        </div>
        <div class="field password-field">
          <label for="s-pass">Password</label>
          <input id="s-pass" type="password" placeholder="Min. 8 characters" data-validate="password" data-validate-message="Min. 8 characters" aria-required="true" data-toggle-password="true" required minlength="8"/>
          <div class="password-strength" id="s-pass-strength">
            <div class="strength-bar">
              <div class="strength-fill"></div>
            </div>
            <span class="strength-text"></span>
          </div>
        </div>
        <div class="field password-field">
          <label for="s-confirm-pass">Confirm Password</label>
          <input id="s-confirm-pass" type="password" placeholder="Confirm your password" data-validate="match" data-match-target="s-pass" data-validate-message="Passwords must match" aria-required="true" data-toggle-password="true" required/>
        </div>
        <div class="field checkbox">
          <input type="checkbox" id="terms" data-validate="required" data-validate-message="You must accept Terms & Conditions" aria-required="true" required/>
          <label for="terms">I accept Terms & Conditions</label>
        </div>
        <button type="submit" class="btn" data-original-text="Create account">Create account</button>
        <div class="divider">or</div>
        <button type="button" class="btn-ghost" aria-label="Sign up with Google">
          <svg width="18" height="18" viewBox="0 0 48 48"><use href="#icon-google"/></svg>
          Sign up with Google
        </button>
      </form>
    </div>

    <!-- PASSWORD RESET MODAL -->
    <div class="modal" id="reset-modal" role="dialog" aria-modal="true" aria-labelledby="reset-title">
      <div class="modal-overlay"></div>
      <div class="modal-content">
        <div class="modal-header">
          <h2 id="reset-title">Reset Password</h2>
          <button type="button" class="modal-close" aria-label="Close dialog" onclick="closeModal('reset-modal')">×</button>
        </div>
        <form id="reset-form" novalidate>
          <div class="field">
            <label for="reset-email">Email Address</label>
            <input id="reset-email" type="email" placeholder="you@example.com" data-validate="email" data-validate-message="Valid email required" aria-required="true" required/>
          </div>
          <button type="submit" class="btn" data-original-text="Send Reset Link">Send Reset Link</button>
          <button type="button" class="btn-ghost" onclick="closeModal('reset-modal')">Cancel</button>
        </form>
      </div>
    </div>

    <footer class="footer">
      <nav class="footer-links">
        <a href="#">Privacy</a>
        <a href="#">Terms</a>
        <a href="#">Security</a>
        <a href="#">Contact Us</a>
      </nav>
      <p class="footer-copy">&copy; 2026 OMABELL. All rights reserved.</p>
    </footer>
    <script src="script.js"></script>
  </body>
</html>
